[project]
name = "distributedkeyvaluestore"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "soumit-kaz", email = "soumit@kaz-software.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
distributedkeyvaluestore = "kv_store:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kv_store"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
